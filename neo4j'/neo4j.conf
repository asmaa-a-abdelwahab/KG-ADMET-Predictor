# Memory configuration

# Initial heap memory for Neo4j (set to 8GB for a 16GB RAM system)
dbms.memory.heap.initial_size=8G
dbms.memory.heap.max_size=8G

# Page cache memory setting (set to 6-7GB for a 16GB RAM system)
dbms.memory.pagecache.size=6G

# Disable external IP access for security (optional)
dbms.default_listen_address=0.0.0.0

# Enable all connections
dbms.default_advertised_address=localhost

# Ensure Neo4j runs with sufficient heap memory and page cache
dbms.jvm.additional=-XX:+UseG1GC
