[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pring-app-modeling"
version = "0.2.0"
description = "Modeling and prediction services for PRING-APP knowledge graphs"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "neo4j>=5.20",
  "loguru>=0.7",
  "matplotlib>=3.7",
  "tabulate>=0.9",
  "pyarrow>=14.0",
  "tqdm>=4.66",
  "jinja2>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
notebooks = ["notebook>=7.0", "ipykernel>=6.0"]
torch = ["torch>=2.2", "torch-geometric>=2.6"]
explain = ["captum>=0.7", "shap>=0.45"]
neo4j-gds = ["graphdatascience>=1.10"]
all = [
  "notebook>=7.0", "ipykernel>=6.0",
  "torch>=2.2", "torch-geometric>=2.6",
  "captum>=0.7", "shap>=0.45", "graphdatascience>=1.10"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pring_modeling*"]
