# PRING-APP Neo4j configuration for PRING-generated knowledge graphs.
# Keep this file minimal. Memory and APOC settings are controlled by docker-compose
# environment variables to avoid duplicate Neo4j configuration entries.
server.default_listen_address=0.0.0.0
server.directories.import=/import

# Useful for larger imports and graph exploration.
db.transaction.timeout=300s
server.bolt.connection_keep_alive=60s

# Allow Neo4j Graph Data Science procedures.
# The GDS plugin itself is installed through NEO4J_PLUGINS in Dockerfile or docker-compose.
dbms.security.procedures.unrestricted=gds.*
dbms.security.procedures.allowlist=gds.*
