name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application
        run: python -m pip install --upgrade pip && python -m pip install --editable ".[dev]"
      - name: Run test suite
        env:
          PYTHONPATH: modeling:streamlit
        run: python -m pytest -q
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
