name: kg-admet-pring-production

services:
  predictor:
    build:
      context: .
      dockerfile: ./modeling/Dockerfile.predictor
    container_name: kg-admet-predictor
    restart: unless-stopped
    ports:
      - "${PREDICTOR_PORT:-8000}:8000"
    environment:
      PRODUCTION_MODEL_DIR: /models/production
      PRECOMPUTED_SCORE_FRAME: /results/production/finalized_training_frame.csv
      PREDICTION_SCORE_MODE: precomputed
      PREDICTION_ALLOW_LIVE_STAGE3: "false"
      PREDICTION_MAX_PAIRS_PER_REQUEST: "${PREDICTION_MAX_PAIRS_PER_REQUEST:-25}"
      PREDICTION_TREE_SHAP_ENABLED: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "1"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-cyp450kg}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    volumes:
      - ./artifacts/models:/models:ro
      - ./artifacts/results:/results:ro
    command: ["python", "-m", "uvicorn", "pring_modeling.prediction_api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--timeout-keep-alive", "10"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G

  streamlit:
    environment:
      PREDICTION_API_URL: http://predictor:8000
      PREDICTION_CONNECT_TIMEOUT_SECONDS: "10"
      PREDICTION_TIMEOUT_SECONDS: "120"
