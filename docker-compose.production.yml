name: kg-admet-pring-production

# Use together with the main compose file:
# docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
services:
  predictor:
    environment:
      PREDICTION_SCORE_MODE: auto
      PRECOMPUTED_SCORE_FRAME: /results/production/finalized_training_frame.csv
      PREDICTION_CACHE_FRAME: /results/production/production_prediction_cache.csv
      PREDICTION_PERSIST_NEW_SCORES: "true"
      PREDICTION_REQUIRE_CACHE_WRITE: "true"
      PREDICTION_PARITY_REQUIRED: "${PREDICTION_PARITY_REQUIRED:-true}"
      PREDICTION_PARITY_SAMPLE_SIZE: "${PREDICTION_PARITY_SAMPLE_SIZE:-5}"
      PREDICTION_PARITY_MAE_MAX: "${PREDICTION_PARITY_MAE_MAX:-0.05}"
      PREDICTION_PARITY_MAX_ABS_ERROR: "${PREDICTION_PARITY_MAX_ABS_ERROR:-0.15}"
      PREDICTION_PARITY_SPEARMAN_MIN: "${PREDICTION_PARITY_SPEARMAN_MIN:-0.90}"
      PREDICTION_PARITY_DECISION_AGREEMENT_MIN: "${PREDICTION_PARITY_DECISION_AGREEMENT_MIN:-0.95}"
      PREDICTION_ALLOW_STAGE3_FALLBACK: "${PREDICTION_ALLOW_STAGE3_FALLBACK:-true}"
      STAGE3_FALLBACK_MODEL_FILE: "${STAGE3_FALLBACK_MODEL_FILE:-/models/production/production_stage3_fallback.joblib}"
      STAGE3_FALLBACK_MANIFEST_FILE: "${STAGE3_FALLBACK_MANIFEST_FILE:-/models/production/stage3_fallback_manifest.json}"
      STAGE1_PAIR_FEATURE_DIR: "${STAGE1_PAIR_FEATURE_DIR:-/modeling_prepared/stage1_neo4j_gds_baselines}"
      STAGE1_PAIR_FEATURE_FRAME: "${STAGE1_PAIR_FEATURE_FRAME:-}"
      PREDICTION_TARGET_BACKGROUND_MIN_ROWS: "${PREDICTION_TARGET_BACKGROUND_MIN_ROWS:-20}"
      PREDICTION_LOCAL_IMPORTANCE_MIN_EFFECT: "${PREDICTION_LOCAL_IMPORTANCE_MIN_EFFECT:-0.01}"
      PRING_GRAPH_VERSION: "${PRING_GRAPH_VERSION:-unknown_graph_snapshot}"
      PREDICTION_UNLOAD_STAGE3_AFTER_SCORE: "true"
      PREDICTION_UNLOAD_SHARED_GRAPH_AFTER_SCORE: "false"
      PREDICTION_STAGE3_BATCH_SIZE: "1"
      PREDICTION_ENABLE_TREE_SHAP: "false"
      PREDICTION_MAX_PAIRS_PER_REQUEST: "${PREDICTION_MAX_PAIRS_PER_REQUEST:-9}"
      OMP_NUM_THREADS: "${PREDICTION_CPU_THREADS:-4}"
      MKL_NUM_THREADS: "${PREDICTION_CPU_THREADS:-4}"
      OPENBLAS_NUM_THREADS: "${PREDICTION_CPU_THREADS:-4}"
      MALLOC_ARENA_MAX: "${MALLOC_ARENA_MAX:-2}"
    volumes:
      - ./artifacts/models:/models:ro
      - ./artifacts/results:/results
      - ${MODEL_PREPARED_DIR:-./artifacts/modeling_prepared}:/modeling_prepared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  streamlit:
    environment:
      PREDICTION_API_URL: http://predictor:8000
      PREDICTION_CONNECT_TIMEOUT_SECONDS: "10"
      PREDICTION_TIMEOUT_SECONDS: "${PREDICTION_TIMEOUT_SECONDS:-1800}"
