version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"   # Neo4j browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - ./neo4j/data:/data           # Persistent data storage for Neo4j
      - ./neo4j/logs:/logs           # Persistent logs storage
      - ./neo4j/conf:/var/lib/neo4j/conf  # Custom config for Neo4j

  streamlit:
    build: ./app
    container_name: app
    ports:
      - "8501:8501"   # Expose Streamlit app on port 8501
    depends_on:
      - neo4j         # Ensure Neo4j starts before Streamlit
    environment:
      - NEO4J_URI=bolt://neo4j:7687   # Connect to Neo4j service
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./app:/app          # Mount the Streamlit app code
