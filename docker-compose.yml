services:
  neo4j:
    build: ./neo4j
    container_name: neo4j
    ports:
      - "7474:7474"  # Neo4j HTTP
      - "7687:7687"  # Neo4j Bolt
    environment:
      - NEO4J_AUTH=neo4j/cyp450kg
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./volumes/neo4j-cypher:/cypher  # Directory for Cypher queries
      - ./volumes/neo4j-data:/data  # Persist data using a named volume
      - ./volumes/neo4j-logs:/logs  # Store logs persistently
      - ./utils:/utils  # Plugins or utilities for Neo4j
      - ./plugins:/plugins  # Custom plugins for Neo4j
      - ./import:/import  # Import folder for Neo4j

  modeling:
    build: ./modeling
    container_name: modeling
    ports:
      - "5000:5000"
    depends_on:
      - neo4j
    volumes:
      - ./streamlit:/streamlit  # App code or data shared with Streamlit
      - ./import:/import  # Shared import folder from Neo4j

  streamlit:
    build: ./streamlit
    container_name: streamlit
    ports:
      - "8501:8501"
    depends_on:
      - neo4j  # Ensure Neo4j starts before Streamlit
      - modeling
    volumes:
      - ./streamlit:/streamlit  # Streamlit application code
      - ../modeling/models:/models  # Access models from the modeling service

volumes:
  neo4j-data:  # Named volume for Neo4j data
  neo4j-logs:  # Named volume for Neo4j logs
  neo4j-cypher:  # Named volume for Cypher queries files
