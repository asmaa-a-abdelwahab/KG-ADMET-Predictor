name: pring-app

services:
  neo4j:
    build:
      context: ./neo4j
    container_name: pring-app-neo4j
    restart: unless-stopped
    ports:
      - "${PRING_BIND_ADDRESS:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${PRING_BIND_ADDRESS:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cyp450kg}"
      # Install both APOC and Graph Data Science
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      # Allow APOC and GDS procedures
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      # APOC file import/export
      NEO4J_apoc_export_file_enabled: "${NEO4J_APOC_FILE_EXPORT_ENABLED:-false}"
      NEO4J_apoc_import_file_enabled: "${NEO4J_APOC_FILE_IMPORT_ENABLED:-false}"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      # Memory
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-2G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-4G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      # Do not bind-mount neo4j.conf as a single file on Docker Desktop;
      # Neo4j/APOC edits this file during startup and bind mounts cause sed rename failures.
      - ${PRING_RUNS_DIR:-./runs}:/runs:ro
      - ./artifacts/neo4j-import:/import
    healthcheck:
      # Use Neo4j's built-in cypher-shell rather than wget/curl. Some Neo4j
      # images do not include wget, which can make a running database appear
      # unhealthy and block pring-loader/modeling/streamlit dependencies.
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u \"${NEO4J_USER:-neo4j}\" -p \"${NEO4J_PASSWORD:-cyp450kg}\" \"RETURN 1 AS ok;\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120
      start_period: 180s

  pring-loader:
    build:
      context: .
      dockerfile: ./neo4j/Dockerfile.pring-loader
    container_name: pring-app-loader
    profiles: ["load"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      PRING_PACKAGE_DIR: "${PRING_PACKAGE_DIR:-/workspace/pring}"
      PRING_PACKAGE_SPEC: "${PRING_PACKAGE_SPEC:-https://github.com/asmaa-a-abdelwahab/PRING-PACKAGE/archive/refs/heads/main.zip}"
      PRING_RUN_DIR: "${PRING_RUN_DIR:-/runs/current}"
      PRING_SCHEMA_DOT: "${PRING_SCHEMA_DOT:-}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-cyp450kg}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      PRING_LOAD_BATCH_SIZE: "${PRING_LOAD_BATCH_SIZE:-1000}"
      PRING_ACTIVITY_THRESHOLD_UM: "${PRING_ACTIVITY_THRESHOLD_UM:-10}"
      PRING_WEAK_ACTIVITY_AS_NEGATIVE: "${PRING_WEAK_ACTIVITY_AS_NEGATIVE:-true}"
      PRING_CANDIDATE_PAIR_MODE: "${PRING_CANDIDATE_PAIR_MODE:-all}"
      PRING_ALLOW_NETWORK: "${PRING_ALLOW_NETWORK:-false}"
    volumes:
      - ${PRING_RUNS_DIR:-./runs}:/runs
      - ${PRING_PROJECT_DIR:-./pring}:/workspace/pring:ro
      - ./artifacts/reports:/reports
    command: ["/opt/kg/bin/load_pring_run.sh"]

  modeling:
    build:
      context: .
      dockerfile: ./modeling/Dockerfile
    container_name: pring-app-modeling
    profiles: ["train"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      PRING_PACKAGE_DIR: "${PRING_PACKAGE_DIR:-/workspace/pring}"
      PRING_PACKAGE_SPEC: "${PRING_PACKAGE_SPEC:-https://github.com/asmaa-a-abdelwahab/PRING-PACKAGE/archive/refs/heads/main.zip}"
      PRING_RUN_DIR: "${PRING_RUN_DIR:-/runs/current}"
      MODEL_OUTPUT_DIR: "${MODEL_OUTPUT_DIR:-/models}"
      MODEL_REPORT_DIR: "${MODEL_REPORT_DIR:-/reports/modeling}"
      MODEL_EXPORT_TO_NEO4J: "${MODEL_EXPORT_TO_NEO4J:-true}"
      MODEL_TARGET_COLUMN: "${MODEL_TARGET_COLUMN:-label}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-cyp450kg}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    volumes:
      # Do not bind-mount neo4j.conf as a single file on Docker Desktop;
      # Neo4j/APOC edits this file during startup and bind mounts cause sed rename failures.
      - ${PRING_RUNS_DIR:-./runs}:/runs:ro
      - ${PRING_PROJECT_DIR:-./pring}:/workspace/pring:ro
      - ./artifacts/models:/models
      - ./artifacts/reports:/reports
    command: ["/opt/kg/bin/run_modeling.sh"]


  predictor:
    init: true
    shm_size: "1gb"
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: ./modeling/Dockerfile.predictor
      args:
        TORCH_VERSION: "${TORCH_VERSION:-2.5.1}"
        TORCH_GEOMETRIC_VERSION: "${TORCH_GEOMETRIC_VERSION:-2.6.1}"
        PYTORCH_INDEX_URL: "${PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}"
        PYG_WHEEL_URL: "${PYG_WHEEL_URL:-https://data.pyg.org/whl/torch-2.5.1+cpu.html}"
    container_name: pring-app-predictor
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${PRING_BIND_ADDRESS:-127.0.0.1}:${PREDICTOR_PORT:-8000}:8000"
    environment:
      PRODUCTION_MODEL_DIR: "/models/production"
      PRECOMPUTED_SCORE_FRAME: "/results/production/finalized_training_frame.csv"
      PREDICTION_CACHE_FRAME: "/results/production/production_prediction_cache.csv"
      PREDICTION_SCORE_MODE: "${PREDICTION_SCORE_MODE:-auto}"
      PREDICTION_PERSIST_NEW_SCORES: "${PREDICTION_PERSIST_NEW_SCORES:-true}"
      PREDICTION_REQUIRE_CACHE_WRITE: "${PREDICTION_REQUIRE_CACHE_WRITE:-true}"
      PREDICTION_PARITY_REQUIRED: "${PREDICTION_PARITY_REQUIRED:-true}"
      PREDICTION_PARITY_SAMPLE_SIZE: "${PREDICTION_PARITY_SAMPLE_SIZE:-5}"
      PREDICTION_PARITY_MAE_MAX: "${PREDICTION_PARITY_MAE_MAX:-0.05}"
      PREDICTION_PARITY_MAX_ABS_ERROR: "${PREDICTION_PARITY_MAX_ABS_ERROR:-0.15}"
      PREDICTION_PARITY_SPEARMAN_MIN: "${PREDICTION_PARITY_SPEARMAN_MIN:-0.90}"
      PREDICTION_PARITY_DECISION_AGREEMENT_MIN: "${PREDICTION_PARITY_DECISION_AGREEMENT_MIN:-0.95}"
      PREDICTION_TARGET_BACKGROUND_MIN_ROWS: "${PREDICTION_TARGET_BACKGROUND_MIN_ROWS:-20}"
      PREDICTION_LOCAL_IMPORTANCE_MIN_EFFECT: "${PREDICTION_LOCAL_IMPORTANCE_MIN_EFFECT:-0.01}"
      PRING_GRAPH_VERSION: "${PRING_GRAPH_VERSION:-unknown_graph_snapshot}"
      PREDICTION_ALLOW_STALE_CACHE: "${PREDICTION_ALLOW_STALE_CACHE:-false}"
      PREDICTION_ALLOW_RUNTIME_MISMATCH: "${PREDICTION_ALLOW_RUNTIME_MISMATCH:-false}"
      PREDICTION_REQUIRE_VERIFIED_ARTIFACTS: "${PREDICTION_REQUIRE_VERIFIED_ARTIFACTS:-false}"
      PREDICTION_API_KEY: "${PREDICTION_API_KEY:-}"
      PREDICTION_DEBUG_ERRORS: "${PREDICTION_DEBUG_ERRORS:-false}"
      PREDICTION_DEVICE: "${PREDICTION_DEVICE:-cpu}"
      # Keep CPU allocation and glibc arenas bounded to reduce peak RSS while
      # loading the shared Stage 3 graph and both checkpoints.
      OMP_NUM_THREADS: "${PREDICTION_CPU_THREADS:-4}"
      MKL_NUM_THREADS: "${PREDICTION_CPU_THREADS:-4}"
      OPENBLAS_NUM_THREADS: "${PREDICTION_CPU_THREADS:-4}"
      MALLOC_ARENA_MAX: "${MALLOC_ARENA_MAX:-2}"
      PREDICTION_UNLOAD_STAGE3_AFTER_SCORE: "${PREDICTION_UNLOAD_STAGE3_AFTER_SCORE:-true}"
      PREDICTION_UNLOAD_SHARED_GRAPH_AFTER_SCORE: "${PREDICTION_UNLOAD_SHARED_GRAPH_AFTER_SCORE:-false}"
      PREDICTION_STAGE3_BATCH_SIZE: "${PREDICTION_STAGE3_BATCH_SIZE:-1}"
      PREDICTION_ALLOW_COMPONENT_FALLBACK: "${PREDICTION_ALLOW_COMPONENT_FALLBACK:-true}"
      PREDICTION_ALLOW_STAGE3_FALLBACK: "${PREDICTION_ALLOW_STAGE3_FALLBACK:-true}"
      STAGE3_FALLBACK_MODEL_FILE: "${STAGE3_FALLBACK_MODEL_FILE:-/models/production/production_stage3_fallback.joblib}"
      STAGE3_FALLBACK_MANIFEST_FILE: "${STAGE3_FALLBACK_MANIFEST_FILE:-/models/production/stage3_fallback_manifest.json}"
      PREDICTION_ENABLE_TREE_SHAP: "${PREDICTION_ENABLE_TREE_SHAP:-false}"
      PREDICTION_MAX_PAIRS: "${PREDICTION_MAX_PAIRS:-9}"
      PREDICTION_MAX_PAIRS_PER_REQUEST: "${PREDICTION_MAX_PAIRS_PER_REQUEST:-9}"
      STAGE1_MODEL_DIR: "${STAGE1_MODEL_DIR:-/models/improved_v2/stage1_gds_extra_trees}"
      STAGE1_EMBEDDING_PROPERTY: "${STAGE1_EMBEDDING_PROPERTY:-pringFastRP}"
      STAGE1_PAIR_FEATURE_DIR: "${STAGE1_PAIR_FEATURE_DIR:-/modeling_prepared/stage1_neo4j_gds_baselines}"
      STAGE1_PAIR_FEATURE_FRAME: "${STAGE1_PAIR_FEATURE_FRAME:-}"
      RGCN_MODEL_DIR: "${RGCN_MODEL_DIR:-/models/improved_v2/stage3_rgcn_sampled}"
      HGT_MODEL_DIR: "${HGT_MODEL_DIR:-/models/improved_v2/stage3_hgt_sampled}"
      STAGE3_PREPARED_DIR: "${STAGE3_PREPARED_DIR:-/modeling_prepared}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-cyp450kg}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    volumes:
      - ./artifacts/models:/models:ro
      - ./artifacts/results:/results
      - ${MODEL_PREPARED_DIR:-./artifacts/modeling_prepared}:/modeling_prepared:ro
    command: ["python", "-m", "uvicorn", "pring_modeling.prediction_api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  streamlit:
    build:
      context: .
      dockerfile: ./streamlit/Dockerfile
    container_name: pring-app-streamlit
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      predictor:
        condition: service_healthy
    ports:
      - "${PRING_BIND_ADDRESS:-127.0.0.1}:${STREAMLIT_PORT:-8501}:8501"
    environment:
      PRING_PACKAGE_DIR: "${PRING_PACKAGE_DIR:-/workspace/pring}"
      PRING_PACKAGE_SPEC: "${PRING_PACKAGE_SPEC:-https://github.com/asmaa-a-abdelwahab/PRING-PACKAGE/archive/refs/heads/main.zip}"
      PRING_RUN_DIR: "${PRING_RUN_DIR:-/runs/current}"
      MODEL_OUTPUT_DIR: "${MODEL_OUTPUT_DIR:-/models}"
      EDA_REPORT_DIR: "${EDA_REPORT_DIR:-/reports}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-cyp450kg}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      PREDICTION_API_URL: "http://predictor:8000"
      PREDICTION_API_KEY: "${PREDICTION_API_KEY:-}"
      PREDICTION_TIMEOUT_SECONDS: "${PREDICTION_TIMEOUT_SECONDS:-1800}"
    volumes:
      # Do not bind-mount neo4j.conf as a single file on Docker Desktop;
      # Neo4j/APOC edits this file during startup and bind mounts cause sed rename failures.
      - ${PRING_RUNS_DIR:-./runs}:/runs:ro
      - ${PRING_PROJECT_DIR:-./pring}:/workspace/pring:ro
      - ./artifacts/models:/models:ro
      - ./artifacts/reports:/reports
    command: ["/opt/kg/bin/start_streamlit.sh"]

volumes:
  neo4j-data:
  neo4j-logs:
